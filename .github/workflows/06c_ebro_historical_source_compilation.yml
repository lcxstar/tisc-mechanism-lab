name: 06c | Original 2017 TISC source with 2016 Ebro inputs
on:
  push:
    branches: [v06-ebro-initial-version-audit]
    paths: ['.github/workflows/06c_ebro_historical_source_compilation.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run-2017:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: danigeos/tisc
          ref: 38c63ab5bacf2045530160ba8e41ae0071a04065
          path: old_tisc
      - name: Install historical source toolchain
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential gfortran time
          mkdir -p results/06_ebro_initial_version_audit/06c_2017_historical_solver old_model
          echo 'CI disables original first-use author mail' > "$HOME/.tiscdefaults"
          test "$(git -C old_tisc rev-parse HEAD)" = "38c63ab5bacf2045530160ba8e41ae0071a04065"
          sha256sum old_tisc/demo/8_Ebro_evol/Ebro_evol.PRM old_tisc/demo/8_Ebro_evol/Ebro_evol.ZINI > results/06_ebro_initial_version_audit/06c_2017_historical_solver/ORIGINAL_2017_INPUT_HASHES.txt
      - name: Compile earliest available 2017 source with only compiler compatibility flags
        run: |
          set -euo pipefail
          d=results/06_ebro_initial_version_audit/06c_2017_historical_solver
          # Historical repository ships a precompiled lib/libreria.o for a different machine.
          # Rebuild ONLY its source on the runner; do not change geological algorithms.
          rm -f old_tisc/lib/libreria.o
          set +e
          make -C old_tisc/src tisc 'OPTS=-O2 -w -std=gnu99 -fcommon' > "$d/BUILD_2017.log" 2>&1
          ec=$?
          set -e
          echo "$ec" > "$d/BUILD_EXIT_CODE.txt"
          tail -n 45 "$d/BUILD_2017.log"
          test "$ec" = 0
          sha256sum old_tisc/bin/tisc > "$d/ORIGINAL_2017_BINARY_SHA256.txt"
      - name: Run first 1 Myr in original 2017-source, 2017-input geometry
        run: |
          set -euo pipefail
          cp -a old_tisc/demo/8_Ebro_evol/. old_model/
          export tisc_dir="$GITHUB_WORKSPACE/old_tisc/"
          d=results/06_ebro_initial_version_audit/06c_2017_historical_solver
          (
            cd old_model
            echo "tisc Ebro_evol -tf-59 -P0 -V1" > COMMAND.txt
            set +e
            /usr/bin/time -f '%e' -o WALL_SEC.txt timeout -k 15s 500 \
              "$GITHUB_WORKSPACE/old_tisc/bin/tisc" Ebro_evol -tf-59 -P0 -V1 > RUN.log 2>&1
            rc=$?
            set -e
            echo "$rc" > EXIT_CODE.txt
            echo "2017_TISC_MODEL_RETURNCODE $rc"
            grep -a '^T=' RUN.log | head -n 8 || true
          )
          cp old_model/COMMAND.txt old_model/RUN.log old_model/EXIT_CODE.txt old_model/WALL_SEC.txt "$d/"
      - name: Compare historical source with actual 2016 output and archive raw state
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re,tarfile
          from pathlib import Path
          import runpy
          p=runpy.run_path('scripts/06a_audit_ebro_initial_parameters.py')
          fun=p['fields'];d=Path('results/06_ebro_initial_version_audit/06c_2017_historical_solver')
          org=fun(Path('old_tisc/demo/8_Ebro_evol/Ebro_evol.screen').read_text(errors='replace'))
          mod=fun((d/'RUN.log').read_text(errors='replace')) if (d/'RUN.log').exists() else {}
          ref=org.get(-59.5,{})
          first=mod.get(-59.5,{})
          qc={'historical_source_commit':'38c63ab5bacf2045530160ba8e41ae0071a04065',
              'historical_source_from':'2017-04-20 original root src, predates 2017 May block/UNIT rename',
              'source_is_exact_2016_binary':False,
              'old_PRM_grids':'104 x 55, dt_eros=0.025',
              'build_exit_code':int((d/'BUILD_EXIT_CODE.txt').read_text()) if (d/'BUILD_EXIT_CODE.txt').exists() else None,
              'run_exit_code':int((d/'EXIT_CODE.txt').read_text()) if (d/'EXIT_CODE.txt').exists() else None,
              'current_2017_early_times':sorted(mod),
              '2016_reference_max_surface_m':ref.get('topography_max_m'),
              '2017_solver_max_surface_m':first.get('topography_max_m'),
              '2016_reference_load_max_pa':ref.get('load_now_max_pa'),
              '2017_solver_load_max_pa':first.get('load_now_max_pa'),
              '2016_reference_deflection_max_m':ref.get('deflection_max_m'),
              '2017_solver_deflection_max_m':first.get('deflection_max_m'),
              'unmodified_2017_source_physics':True}
          qc['reproduced_early_historical']=bool(qc['run_exit_code']==0 and first.get('topography_max_m') is not None and abs(first['topography_max_m']-ref['topography_max_m'])<50)
          (d/'ORIGINAL_2017_REPLAY_QC.json').write_text(json.dumps(qc,indent=2))
          if Path('old_model/RUN.log').exists():
            with tarfile.open(d/'2017_SOURCE_NATIVE_FIRST1MYR.tar.gz','w:gz',compresslevel=3) as tf:
              for f in Path('old_model').iterdir():
                if f.is_file() and (f.suffix in ('.PRM','.UNIT','.ZINI','.SLV','.xyzt','.xyw','.hrz','.all','.bas','.lak','.st') or f.name in ('RUN.log','EXIT_CODE.txt','COMMAND.txt')):
                  tf.add(f,arcname=f.name)
          print('HISTORICAL_2017_COMPAT_RESULT',json.dumps(qc))
          PY
      - name: Save even failed compilation evidence for forensic reproducibility
        if: always()
        run: |
          set -euo pipefail
          git add -f results/06_ebro_initial_version_audit/06c_2017_historical_solver
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'audit(Ebro): pin old author 2017 solver first1Myr exact original inputs plus build errors'
            for i in 1 2 3 4 5; do
              git fetch origin v06-ebro-initial-version-audit
              git rebase origin/v06-ebro-initial-version-audit
              if git push origin HEAD:v06-ebro-initial-version-audit; then exit 0; fi
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EBRO_06C_ORIGINAL_2017_SOURCE_REPLAY
          path: results/06_ebro_initial_version_audit/06c_2017_historical_solver/
          retention-days: 90
