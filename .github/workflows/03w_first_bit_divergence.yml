name: 03w | Identify first native floating-point state divergence substep
on:
  push:
    branches: [v03v-precision-divergence-convergence]
    paths:
      - '.github/workflows/03w_first_bit_divergence.yml'
      - 'scripts/prepare_03v_precision_inputs.py'
      - 'scripts/analyze_03v_divergence.py'
      - 'scripts/profile_03w_state_checksums.py'
      - 'scripts/summarize_03w_first_bit_divergence.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  divergence:
    name: "Stage N${{ matrix.grid }} T${{ matrix.horizon }} Myr: drainage/lake numerical divergence"
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        include:
          - grid: 121
            horizon: 3
            max_time: 900
          - grid: 401
            horizon: 3
            max_time: 1800
    steps:
      - uses: actions/checkout@v4
      - name: Checkout author exact commit
        uses: actions/checkout@v4
        with:
          repository: danigeos/tisc
          ref: d18b7d270f4d671b80223e10dede329ad35cafdd
          path: upstream
      - name: Install compiler
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential gfortran time
      - name: Compile 03t accepted float32 vs 03u1 local dh_sed double, independently
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = d18b7d270f4d671b80223e10dede329ad35cafdd
          mkdir -p qc_03v/source qc_03v/bin
          python3 scripts/normalize_upstream_nbsp.py upstream/tisc/src/surf_proc.c qc_03v/source/NBSP_AUDIT.json
          python3 scripts/patch_fast_lake_membership.py upstream/tisc/src/surf_proc.c qc_03v/source
          python3 scripts/patch_03j_evap_cache.py upstream/tisc/src/surf_proc.c qc_03v/source
          python3 scripts/patch_03j_zero_evap_fastpath.py upstream/tisc/src/surf_proc.c qc_03v/source
          python3 scripts/patch_03k_nonnegative_incision_slope.py upstream/tisc/src/surf_proc.c qc_03v/source
          python3 scripts/profile_03s_double_ledger.py upstream/tisc/src/surf_proc.c qc_03v/source
          python3 scripts/patch_03t_correct_sediment_balance.py upstream/tisc/src/surf_proc.c qc_03v/source
          python3 scripts/profile_03w_state_checksums.py upstream/tisc/src/surf_proc.c qc_03v/source
          make -C upstream/tisc/src tisc
          cp upstream/bin/tisc qc_03v/bin/tisc_reference
          python3 scripts/patch_03u1_double_sediment_increment.py upstream/tisc/src/surf_proc.c qc_03v/source
          rm -f upstream/tao+tisc_commons/build/surf_proc.o
          make -C upstream/tisc/src tisc
          cp upstream/bin/tisc qc_03v/bin/tisc_optimized
          sha256sum qc_03v/bin/* > qc_03v/source/EXECUTABLES_SHA256.txt
          echo CI > "$HOME/.tiscdefaults"
      - name: Establish paired exact tectonic input and horizon, original flexure
        run: |
          set -euo pipefail
          python3 scripts/prepare_03v_precision_inputs.py qc_03v/experiment --grid ${{ matrix.grid }} --dt 0.5 --dt-eros 0.05 --horizon ${{ matrix.horizon }}
      - name: Run both controlled numerical histories through requested time
        run: |
          set -euo pipefail
          export tisc_dir="$GITHUB_WORKSPACE/upstream/"
          export PATH="$tisc_dir/bin:$PATH"
          for variant in reference optimized; do
            (
              cd qc_03v/experiment/"$variant"
              echo "tisc demo -V1 -tf${{ matrix.horizon }} -qplotting_mode=0" > ACTUAL_COMMAND.txt
              set +e
              /usr/bin/time -f '%e' -o WALL_SEC.txt timeout -k 15s ${{ matrix.max_time }} \
                "$GITHUB_WORKSPACE/qc_03v/bin/tisc_$variant" demo -V1 -tf${{ matrix.horizon }} -qplotting_mode=0 > RUN.log 2>&1
              code=$?
              set -e
              echo "$code" > EXIT_CODE.txt
              echo "03V_GRID${{ matrix.grid }}_TF${{ matrix.horizon }} $variant EXIT=$code"
              grep -a 'TISC_03T_CORRECTED_BALANCE' RUN.log | tail -n 2 || true
            )
          done
      - name: Quantify first visible height, river graph and true lake membership changes
        run: |
          python3 scripts/analyze_03v_divergence.py qc_03v/experiment ${{ matrix.horizon }}
          python3 scripts/summarize_03w_first_bit_divergence.py qc_03v/experiment ${{ matrix.horizon }}
      - name: Preserve scientific source, logs, maps and topology audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "TISC03W_BITSTATE_N${{ matrix.grid }}_TF${{ matrix.horizon }}"
          path: |
            qc_03v/source/
            qc_03v/experiment/
          retention-days: 30
          if-no-files-found: warn
