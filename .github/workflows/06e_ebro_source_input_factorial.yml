name: 06e | Ebro actual 2017 versus 2026 source-by-input factorial
on:
  push:
    branches: [v06-ebro-initial-version-audit]
    paths: ['.github/workflows/06e_ebro_source_input_factorial.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cross-source-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: danigeos/tisc
          ref: 38c63ab5bacf2045530160ba8e41ae0071a04065
          path: old_tisc
      - uses: actions/checkout@v4
        with:
          repository: danigeos/tisc
          ref: d18b7d270f4d671b80223e10dede329ad35cafdd
          path: upstream
      - name: Compile early 2017 and current 2026 upstream sources separately
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential gfortran time
          mkdir -p results/06_ebro_initial_version_audit/06e_source_input_factorial
          echo CI > "$HOME/.tiscdefaults"
          test "$(git -C old_tisc rev-parse HEAD)" = 38c63ab5bacf2045530160ba8e41ae0071a04065
          test "$(git -C upstream rev-parse HEAD)" = d18b7d270f4d671b80223e10dede329ad35cafdd
          rm -f old_tisc/lib/libreria.o
          make -C old_tisc/src tisc 'OPTS=-O2 -w -std=gnu99 -fcommon'
          python3 scripts/normalize_upstream_nbsp.py upstream/tisc/src/surf_proc.c results/06_ebro_initial_version_audit/06e_source_input_factorial/NBSP_ONLY.json
          make -C upstream/tisc/src tisc
          sha256sum old_tisc/bin/tisc upstream/bin/tisc > results/06_ebro_initial_version_audit/06e_source_input_factorial/TWO_SOURCE_EXECUTABLE_HASHES.txt
      - name: Execute 2x2 source-input full first half Myr plus density extra control
        run: |
          set -euo pipefail
          python3 scripts/06e_ebro_source_input_factorial.py \
            --old-src old_tisc \
            --new-src upstream \
            --old-input old_tisc/demo/8_Ebro_evol \
            --new-input upstream/tisc/demo/8_Ebro_evol \
            --audit-script scripts/06a_audit_ebro_initial_parameters.py \
            --work source_factorial_work \
            --out results/06_ebro_initial_version_audit/06e_source_input_factorial
      - name: Save results even for a failed physics outcome
        if: always()
        run: |
          set -euo pipefail
          git add -f results/06_ebro_initial_version_audit/06e_source_input_factorial
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'results(Ebro): five executed 2017x2026 source-input cross-replays and firststep QC'
            for i in 1 2 3 4 5 6; do
              git fetch origin v06-ebro-initial-version-audit
              git rebase origin/v06-ebro-initial-version-audit
              if git push origin HEAD:v06-ebro-initial-version-audit; then exit 0; fi
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EBRO_06E_2017_VS_2026_SOURCE_BY_INPUT
          path: results/06_ebro_initial_version_audit/06e_source_input_factorial/
          retention-days: 90
