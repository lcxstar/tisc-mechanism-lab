name: Ebro V1 | complete 60Myr moderate-grid native forward
on:
  push:
    branches: [experiment/ebro-spacetime-refined-v1-20261027]
    paths: ['.github/workflows/ebro_v1_full60_moderate_forward.yml','scripts/performance/**']
  pull_request:
    branches: [experiment/performance-v3-independent-demos-20261027]
    paths: ['.github/workflows/ebro_v1_full60_moderate_forward.yml','scripts/performance/**']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  short-native-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    name: "Ebro 60 Myr ${{ matrix.case }} V08+V3"
    strategy:
      fail-fast: false
      matrix: {case: [original, moderate_both]}
    env:
      CASE_NAME: ${{ matrix.case }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: danigeos/tisc
          ref: d18b7d270f4d671b80223e10dede329ad35cafdd
          path: upstream
          persist-credentials: false
      - name: Setup compiler and plotting dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential gfortran time
          python3 -m pip install --break-system-packages numpy matplotlib
      - name: Compile audited solver with V08 salt physics bugfix and V3 speed candidates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = d18b7d270f4d671b80223e10dede329ad35cafdd
          mkdir -p ebro_audit_source
          python3 scripts/normalize_upstream_nbsp.py upstream/tisc/src/surf_proc.c ebro_audit_source/NBSP_FIX.json
          python3 scripts/performance/patch_tisc_salt_model_v08.py upstream/tisc/src/surf_proc.c ebro_audit_source/salt_v08
          python3 scripts/performance/patch_tisc_stable_sort_v3.py upstream/tisc/src/tisclib.c
          python3 scripts/performance/patch_tisc_lake_evap_v3.py upstream/tisc/src/surf_proc.c
          python3 scripts/performance/patch_tisc_outlet_scan_v3.py upstream/tisc/src/surf_proc.c
          python3 scripts/performance/patch_tisc_lake_membership_v3.py upstream/tisc/src/surf_proc.c
          sha256sum upstream/tisc/src/surf_proc.c upstream/tisc/src/tisclib.c > ebro_audit_source/SOURCE_SHA256.txt
          make -C upstream/tisc/src tisc > ebro_audit_source/BUILD.log 2>&1 || { tail -100 ebro_audit_source/BUILD.log; exit 1; }
          sha256sum upstream/bin/tisc > ebro_audit_source/BINARY_SHA256.txt
          git -C upstream rev-parse HEAD > ebro_audit_source/UPSTREAM_COMMIT.txt
          git rev-parse HEAD > ebro_audit_source/LAB_COMMIT.txt
          echo CI > "$HOME/.tiscdefaults"
      - name: Prepare actual original author Ebro input and time/space refinement
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/performance/prepare_ebro_refinement.py "${{ matrix.case }}"
      - name: Execute genuine complete -60 to 0 Ma native process
        shell: bash
        run: |
          set -euo pipefail
          export tisc_dir="$GITHUB_WORKSPACE/upstream/"
          export PATH="$tisc_dir/bin:$PATH"
          cd "ebro_v1/${{ matrix.case }}"
          echo 'tisc Ebro_evol -qplotting_mode=0 -V1' > ACTUAL_COMMAND.txt
          set +e
          /usr/bin/time -v -o RESOURCE_USAGE.txt timeout -k 10s 6000 \
            tisc Ebro_evol -qplotting_mode=0 -V1 > RUN.log 2>&1
          code=$?
          set -e
          echo "$code" > EXIT_CODE.txt
          echo "NATIVE_EBRO_EXIT=${{ matrix.case }}:$code"
          grep -aE 'T=|topogr.  :|outp_seds:|Final total sediment' RUN.log | tail -n 30 || true
      - name: Validate saved native outputs and draw original-resolution planview
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/performance/audit_plot_ebro_native.py "ebro_v1/${{ matrix.case }}"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          case=os.environ["CASE_NAME"]
          status=json.loads((Path("ebro_v1")/case/"NATIVE_QC.json").read_text())
          ages=status["ages_printed_Ma"]
          assert status["native_success"] and abs(ages[-1])<1e-5, ("Full 60Ma native time did not complete", status)
          # A converged/geologically plausible field is a SEPARATE scientific gate.
          # Exceeding this diagnostic screen will fail the workflow but preserve outputs.
          assert status["nodes_above_5000_m"]==0, "Unphysical isolated >5km first-order native topo screen failed"
          print("EBRO_FULL_60MA_NUMERICALLY_SCREENED",case,"AGES",len(ages))
          PY
      - name: Preserve native fields, input manifest and figure (even when failed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 'EBRO_FULL60_${{ matrix.case }}_60MYR'
          path: |
            ebro_audit_source/
            ebro_v1/${{ matrix.case }}/
          retention-days: 30
          if-no-files-found: warn
