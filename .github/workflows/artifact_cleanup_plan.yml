name: Storage | Public conservative Artifacts cleanup DRY RUN
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/artifact_cleanup_plan.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: List retained milestones and deletion candidates without deleting
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/cleanup_actions_artifacts.py
