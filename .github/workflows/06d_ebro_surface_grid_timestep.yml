name: 06d | Ebro 2017 grid versus current and hydrology-erosion isolate
on:
  push:
    branches: [v06-ebro-initial-version-audit]
    paths: ['.github/workflows/06d_ebro_surface_grid_timestep.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  eleven-causal-trials:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: danigeos/tisc
          ref: d18b7d270f4d671b80223e10dede329ad35cafdd
          path: upstream
      - name: Compile normalized-only pinned original TISC current solver
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential gfortran time
          mkdir -p source_audit results/06_ebro_initial_version_audit/06d_surface_grid_timestep
          test "$(git -C upstream rev-parse HEAD)" = d18b7d270f4d671b80223e10dede329ad35cafdd
          python3 scripts/normalize_upstream_nbsp.py upstream/tisc/src/surf_proc.c source_audit/NBSP.json
          make -C upstream/tisc/src tisc
          sha256sum upstream/bin/tisc upstream/tisc/src/surf_proc.c > source_audit/2026_EXE_HASH.txt
          echo 'CI disable original notify' > "$HOME/.tiscdefaults"
      - name: Run 11 controlled model variants with original input SHA256 before intervention
        run: |
          set -euo pipefail
          python3 scripts/06d_ebro_surface_grid_timestep_controls.py \
            --upstream-input upstream/tisc/demo/8_Ebro_evol \
            --tisc-executable upstream/bin/tisc \
            --tisc-root upstream \
            --script-audit scripts/06a_audit_ebro_initial_parameters.py \
            --work early_trial_06d \
            --out results/06_ebro_initial_version_audit/06d_surface_grid_timestep
      - name: Permanent scientific archive and original inputs
        if: always()
        run: |
          set -euo pipefail
          cp source_audit/* results/06_ebro_initial_version_audit/06d_surface_grid_timestep/
          git add -f results/06_ebro_initial_version_audit/06d_surface_grid_timestep
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'results(Ebro): 2017 grid and hydrology versus erosion, 11 full original-code early runs'
            for i in 1 2 3 4 5 6; do
              git fetch origin v06-ebro-initial-version-audit
              git rebase origin/v06-ebro-initial-version-audit
              if git push origin HEAD:v06-ebro-initial-version-audit; then exit 0; fi
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EBRO_06D_2017_GRID_DT_SURFACE_ISOLATION
          path: results/06_ebro_initial_version_audit/06d_surface_grid_timestep/
          retention-days: 90
