name: 06b | Ebro pristine early-time cause isolation, ten variants
on:
  push:
    branches: [v06-ebro-initial-version-audit]
    paths: ['.github/workflows/06b_ebro_firststep_interventions.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  isolated-firststeps:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: danigeos/tisc
          ref: d18b7d270f4d671b80223e10dede329ad35cafdd
          path: upstream
      - name: Compile unchanged pinned author solver with only NBSP whitespace fix
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential gfortran time
          mkdir -p source_audit results/06_ebro_initial_version_audit/06b_early_parameter_interventions
          test "$(git -C upstream rev-parse HEAD)" = d18b7d270f4d671b80223e10dede329ad35cafdd
          python3 scripts/normalize_upstream_nbsp.py upstream/tisc/src/surf_proc.c source_audit/NBSP_COMPILE_FIX.json
          make -C upstream/tisc/src tisc
          sha256sum upstream/bin/tisc upstream/tisc/src/surf_proc.c > source_audit/CURRENT_SOLVER_SHA256.txt
          echo 'CI: suppress original first-use mail code' > "$HOME/.tiscdefaults"
      - name: Run ten controlled first-half-Myr variants in independent author input directories
        run: |
          set -euo pipefail
          python3 scripts/06b_ebro_firststep_interventions.py \
            --upstream-input upstream/tisc/demo/8_Ebro_evol \
            --tisc-executable upstream/bin/tisc \
            --tisc-root upstream \
            --script-audit scripts/06a_audit_ebro_initial_parameters.py \
            --work early_trial \
            --out results/06_ebro_initial_version_audit/06b_early_parameter_interventions
      - name: Commit full original first-step logs, corrected source hashes, native fields and QC
        if: always()
        run: |
          set -euo pipefail
          cp source_audit/* results/06_ebro_initial_version_audit/06b_early_parameter_interventions/
          git add -f results/06_ebro_initial_version_audit/06b_early_parameter_interventions
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'results(Ebro): archive ten pinned-author original-source initial condition interventions'
            for i in 1 2 3 4 5 6; do
              git fetch origin v06-ebro-initial-version-audit
              git rebase origin/v06-ebro-initial-version-audit
              if git push origin HEAD:v06-ebro-initial-version-audit; then exit 0; fi
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EBRO_06B_INITIAL_CONDITION_CAUSAL_CONTROLS
          path: results/06_ebro_initial_version_audit/06b_early_parameter_interventions/
          retention-days: 90
