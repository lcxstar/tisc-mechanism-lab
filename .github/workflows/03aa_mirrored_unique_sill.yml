name: 03aa | Mirrored unique-saddle original TISC physics audit
on:
  push:
    branches: [v03aa-mirrored-unique-sill]
    paths:
      - '.github/workflows/03aa_mirrored_unique_sill.yml'
      - 'scripts/build_03aa_mirror_sills.py'
      - 'scripts/analyze_03aa_mirror_sills.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mirror-original-tisc:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: danigeos/tisc
          ref: d18b7d270f4d671b80223e10dede329ad35cafdd
          path: upstream
      - name: Install pinned build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential gfortran time
          python3 -m pip install -q numpy
          test "$(git -C upstream rev-parse HEAD)" = d18b7d270f4d671b80223e10dede329ad35cafdd
      - name: Compile accepted original lake physics and corrected mass diagnostic
        run: |
          set -euo pipefail
          mkdir -p qc03aa/source qc03aa/bin
          python3 scripts/normalize_upstream_nbsp.py upstream/tisc/src/surf_proc.c qc03aa/source/NBSP_AUDIT.json
          python3 scripts/patch_fast_lake_membership.py upstream/tisc/src/surf_proc.c qc03aa/source
          python3 scripts/patch_03j_evap_cache.py upstream/tisc/src/surf_proc.c qc03aa/source
          python3 scripts/patch_03j_zero_evap_fastpath.py upstream/tisc/src/surf_proc.c qc03aa/source
          python3 scripts/patch_03k_nonnegative_incision_slope.py upstream/tisc/src/surf_proc.c qc03aa/source
          python3 scripts/profile_03s_double_ledger.py upstream/tisc/src/surf_proc.c qc03aa/source
          python3 scripts/patch_03t_correct_sediment_balance.py upstream/tisc/src/surf_proc.c qc03aa/source
          python3 scripts/patch_03x_raw_float_xyw.py upstream/tisc/src/tiscio.c qc03aa/source
          make -C upstream/tisc/src tisc
          cp upstream/bin/tisc qc03aa/bin/tisc_original
          echo CI > "$HOME/.tiscdefaults"
          sha256sum qc03aa/bin/tisc_original > qc03aa/source/EXE_SHA256.txt
      - name: Generate original symmetric lake and exactly reflected unique-throat inputs
        run: |
          set -euo pipefail
          python3 scripts/build_03z_micro_lake.py upstream/tisc/demo/6_tectonics/demo.PRM qc03aa/toy
          python3 scripts/build_03aa_mirror_sills.py qc03aa/toy
      - name: Run seven independent original TISC lake and sediment forward cases
        run: |
          set -euo pipefail
          export tisc_dir="$GITHUB_WORKSPACE/upstream/"
          export PATH="$tisc_dir/bin:$PATH"
          for case in $(python3 -c 'import json; print(" ".join(x["name"] for x in json.load(open("qc03aa/toy/INPUT_SPEC.json"))["experiments"]))'); do
            (
              cd "qc03aa/toy/$case"
              echo 'tisc micro -V1 -tf0.1 -qplotting_mode=0' > ACTUAL_COMMAND.txt
              set +e
              /usr/bin/time -f '%e' -o WALL_SEC.txt timeout -k 10s 180 \
                "$GITHUB_WORKSPACE/qc03aa/bin/tisc_original" micro -V1 -tf0.1 -qplotting_mode=0 > RUN.log 2>&1
              code=$?
              set -e
              echo "$code" > EXIT_CODE.txt
              echo "03AA_PHYSICS case=$case exit=$code"
              grep -a 'TISC_03T_CORRECTED_BALANCE' RUN.log | tail -n 1 || true
            )
          done
      - name: Audit mirror-equivariance and independent mass balance
        run: |
          python3 scripts/analyze_03aa_mirror_sills.py qc03aa/toy
      - name: Archive raw native physics and symmetry QC
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 03AA_MIRRORED_ORIGINAL_TISC_41GRID
          path: |
            qc03aa/source/
            qc03aa/toy/
          retention-days: 45
          if-no-files-found: warn
