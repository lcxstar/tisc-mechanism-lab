name: 03l | Scientific phase snapshots of official 401 tectonics example

on:
  push:
    branches: [v03l-tectonics-scientific-qc]
    paths:
      - '.github/workflows/03l_401_phase_snapshots.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase-401:
    name: '401x401 original tectonics + flexure through ${{ matrix.horizon }} Myr'
    runs-on: ubuntu-latest
    timeout-minutes: 36
    strategy:
      fail-fast: false
      matrix:
        horizon: [6, 10, 12]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: danigeos/tisc
          ref: d18b7d270f4d671b80223e10dede329ad35cafdd
          path: upstream
      - name: Install author's compilers
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential gfortran time
      - name: Compile validated 03g+03j optimized code and explicitly marked 03k slope fix
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = d18b7d270f4d671b80223e10dede329ad35cafdd
          mkdir -p phase_03l/source
          python3 scripts/normalize_upstream_nbsp.py upstream/tisc/src/surf_proc.c phase_03l/source/NBSP.json
          python3 scripts/patch_fast_lake_membership.py upstream/tisc/src/surf_proc.c phase_03l/source
          python3 scripts/patch_03j_evap_cache.py upstream/tisc/src/surf_proc.c phase_03l/source
          python3 scripts/patch_03j_zero_evap_fastpath.py upstream/tisc/src/surf_proc.c phase_03l/source
          python3 scripts/patch_03k_nonnegative_incision_slope.py upstream/tisc/src/surf_proc.c phase_03l/source
          make -C upstream/tisc/src tisc
          sha256sum upstream/bin/tisc > phase_03l/source/TISC_BINARY_SHA256.txt
          echo CI > "$HOME/.tiscdefaults"
      - name: Validate original author inputs then prepare stage
        run: |
          set -euo pipefail
          python3 scripts/prepare_03g_validation.py N401 full_coupled
          mkdir -p 'phase_03l/T${{ matrix.horizon }}'
          cp -a validation_03g/N401/full_coupled/optimized/. 'phase_03l/T${{ matrix.horizon }}/'
          git -C upstream rev-parse HEAD > 'phase_03l/T${{ matrix.horizon }}/AUTHOR_COMMIT.txt'
          git rev-parse HEAD > 'phase_03l/T${{ matrix.horizon }}/LAB_COMMIT.txt'
          cmp upstream/tisc/demo/6_tectonics/demo.PRM 'phase_03l/T${{ matrix.horizon }}/demo.PRM'
          cmp upstream/tisc/demo/6_tectonics/demo1.UNIT 'phase_03l/T${{ matrix.horizon }}/demo1.UNIT'
          cmp upstream/tisc/demo/6_tectonics/demo2.UNIT 'phase_03l/T${{ matrix.horizon }}/demo2.UNIT'
      - name: Recompute original 401 geology up to requested event time
        run: |
          set -euo pipefail
          export tisc_dir="$GITHUB_WORKSPACE/upstream/"
          export PATH="$tisc_dir/bin:$PATH"
          (
            cd 'phase_03l/T${{ matrix.horizon }}'
            echo 'tisc demo -V1 -tf${{ matrix.horizon }} -qplotting_mode=0' > ACTUAL_COMMAND.txt
            set +e
            /usr/bin/time -f '%e' -o WALL_SEC.txt timeout -k 15s 1900 \
              tisc demo -V1 -tf${{ matrix.horizon }} -qplotting_mode=0 > RUN.log 2>&1
            rc=$?
            set -e
            echo "$rc" > EXIT_CODE.txt
            echo "03l 401 horizon ${{ matrix.horizon }} exit=$rc"
            grep -aE '^T=|outp_seds:|TISC_03K_GUARD' RUN.log | tail -n 17 || true
          )
          python3 scripts/summarize_03k_experiment.py phase_03l/T${{ matrix.horizon }} ${{ matrix.horizon }}
      - name: Check grid completeness and horizon metadata
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=Path("phase_03l/T${{ matrix.horizon }}")
          for name in ("demo.xyw","demo.st","demo.hrz","demo.xyzt","demo.pfl","demo.lak","demo.bas"):
              if not (d/name).exists():
                  raise SystemExit("Missing output "+name)
          for name in ("demo.st","demo.hrz","demo.xyzt"):
              rows=sum(1 for s in (d/name).open() if s.strip() and not s.startswith("#"))
              print(name,rows)
              if rows!=401*401:raise SystemExit("Invalid row count for "+name)
          print("First line of horizons:",(d/"demo.hrz").open().readline().strip())
          PY
      - name: Preserve event-phase physical fields and log/QC, including input audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 'TISC03L_401_PHASE_T${{ matrix.horizon }}'
          path: |
            phase_03l/source/
            phase_03l/T${{ matrix.horizon }}/
          retention-days: 30
          if-no-files-found: warn
