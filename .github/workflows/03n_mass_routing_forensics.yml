name: 03n | Find first hydrological sediment mass discontinuity

on:
  push:
    branches: [v03m-mass-conservation-ledger]
    paths:
      - '.github/workflows/03n_mass_routing_forensics.yml'
      - 'scripts/profile_03n_mass_routing.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forensic-401:
    name: '401 coupled 0–2 Myr mass continuity, 1024-node checkpoints'
    runs-on: ubuntu-latest
    timeout-minutes: 36
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: danigeos/tisc
          ref: d18b7d270f4d671b80223e10dede329ad35cafdd
          path: upstream
      - name: Install author's compiler
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential gfortran time
      - name: Build read-only interval-accounting tracer on 03k source
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = d18b7d270f4d671b80223e10dede329ad35cafdd
          mkdir -p forensic_03n/source
          python3 scripts/normalize_upstream_nbsp.py upstream/tisc/src/surf_proc.c forensic_03n/source/NBSP_AUDIT.json
          python3 scripts/patch_fast_lake_membership.py upstream/tisc/src/surf_proc.c forensic_03n/source
          python3 scripts/patch_03j_evap_cache.py upstream/tisc/src/surf_proc.c forensic_03n/source
          python3 scripts/patch_03j_zero_evap_fastpath.py upstream/tisc/src/surf_proc.c forensic_03n/source
          python3 scripts/patch_03k_nonnegative_incision_slope.py upstream/tisc/src/surf_proc.c forensic_03n/source
          python3 scripts/profile_03n_mass_routing.py upstream/tisc/src/surf_proc.c forensic_03n/source
          make -C upstream/tisc/src tisc
          sha256sum upstream/bin/tisc > forensic_03n/source/TISC_TRACED_BINARY_SHA256.txt
          echo CI > "$HOME/.tiscdefaults"
      - name: Prepare byte-exact 401 scientific source inputs
        run: |
          set -euo pipefail
          python3 scripts/prepare_03g_validation.py N401 full_coupled
          mkdir -p forensic_03n/N401_t2
          cp -a validation_03g/N401/full_coupled/optimized/. forensic_03n/N401_t2/
          cmp upstream/tisc/demo/6_tectonics/demo.PRM forensic_03n/N401_t2/demo.PRM
          cmp upstream/tisc/demo/6_tectonics/demo1.UNIT forensic_03n/N401_t2/demo1.UNIT
          cmp upstream/tisc/demo/6_tectonics/demo2.UNIT forensic_03n/N401_t2/demo2.UNIT
      - name: Execute four early 0.5-Myr intervals at original coupled settings
        run: |
          set -euo pipefail
          export tisc_dir="$GITHUB_WORKSPACE/upstream/"
          export PATH="$tisc_dir/bin:$PATH"
          (
            cd forensic_03n/N401_t2
            echo 'tisc demo -V1 -tf2 -qplotting_mode=0' > ACTUAL_COMMAND.txt
            set +e
            /usr/bin/time -f '%e' -o WALL_SEC.txt timeout -k 15s 1700 \
              tisc demo -V1 -tf2 -qplotting_mode=0 > RUN.log 2>&1
            rc=$?
            set -e
            echo "$rc" > EXIT_CODE.txt
            echo "03n 401 source-sink return=$rc"
            grep -a 'TISC_03N_SUMMARY' RUN.log | tail -n 12 || true
          )
          python3 - <<'PY'
          from pathlib import Path
          import json,re,csv
          d=Path("forensic_03n/N401_t2")
          log=(d/"RUN.log").read_text(errors="replace")
          rx=r'TISC_03N_CHUNK timeMyr=([^\s]+) node=(\d+) row=(\d+) col=(\d+) delta_budget_kg=([^\s]+) stock_kg=([^\s]+) source_kg=([^\s]+) net_sed_kg=([^\s]+) exported_kg=([^\s]+) closed_lake_mass_reset_kg=([^\s]+)'
          records=[dict(timeMyr=float(m[1]),node=int(m[2]),row=int(m[3]),col=int(m[4]),delta_budget_kg=float(m[5]),stock_kg=float(m[6]),source_kg=float(m[7]),net_sed_kg=float(m[8]),exported_kg=float(m[9]),closed_lake_mass_reset_kg=float(m[10])) for m in re.finditer(rx,log)]
          if not records:raise SystemExit("No 03n records; instrumentation failed")
          with (d/"03N_ROUTING_CHECKPOINTS.csv").open("w",newline="") as f:
              w=csv.DictWriter(f,fieldnames=list(records[0]));w.writeheader();w.writerows(records)
          groups={}
          for x in records:groups.setdefault(x["timeMyr"],[]).append(x)
          output=[]
          for t,xs in sorted(groups.items()):
              mx=max(xs,key=lambda x:abs(x["delta_budget_kg"]))
              first=next((x for x in xs if abs(x["delta_budget_kg"])>1e12),None)
              end=xs[-1]
              output.append({"timeMyr":t,"max_abs_residual_kg":abs(mx["delta_budget_kg"]),"first_above_1e12":first,
                "final_residual_kg":end["delta_budget_kg"],"final_closed_lake_cleared_kg":end["closed_lake_mass_reset_kg"],"node_checkpoints":len(xs)})
          with (d/"03N_FIRST_DISCONTINUITY.json").open("w") as f:json.dump(output,f,indent=2)
          print("03N_STAGE_DIAG",json.dumps(output))
          PY
      - name: Archive source diffs, checkpoint CSV, and author input/QC
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TISC03N_401_MASS_ROUTING
          path: |
            forensic_03n/source/
            forensic_03n/N401_t2/
          retention-days: 30
          if-no-files-found: warn
