name: Ebro pristine source | Original hydrology first 1 Myr forensic gate
on:
  push:
    branches: [v04-official-demo-completion]
    paths: ['.github/workflows/08b_ebro_pristine_first1myr.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  original-ebro-early:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: danigeos/tisc
          ref: d18b7d270f4d671b80223e10dede329ad35cafdd
          path: upstream
      - name: Compile author source with ONLY whitespace portability normalization
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential gfortran time
          mkdir -p early_source_qc/ early_model/ results/04_09_official_demo_suite/08_ebro/pristine_early
          test "$(git -C upstream rev-parse HEAD)" = d18b7d270f4d671b80223e10dede329ad35cafdd
          python3 scripts/normalize_upstream_nbsp.py upstream/tisc/src/surf_proc.c early_source_qc/WHITESPACE_FIX.json
          make -C upstream/tisc/src tisc
          sha256sum upstream/tisc/src/surf_proc.c upstream/bin/tisc > early_source_qc/NORMALIZED_SOURCE_HASHES.txt
          echo "CI" > "$HOME/.tiscdefaults"
          cp -a upstream/tisc/demo/8_Ebro_evol/. early_model/
      - name: Controlled truncated run 60 to 59 Ma in original hydrology
        run: |
          set -euo pipefail
          export tisc_dir="$GITHUB_WORKSPACE/upstream"
          export PATH="$tisc_dir/bin:$PATH"
          (
            cd early_model
            echo 'tisc Ebro_evol -V1 -tf-59 -qplotting_mode=0' > COMMAND.txt
            set +e
            /usr/bin/time -f '%e' -o WALL_SEC.txt timeout -k 10s 3200 \
              "$tisc_dir/bin/tisc" Ebro_evol -V1 -tf-59 -qplotting_mode=0 > RUN.log 2>&1
            rc=$?
            set -e
            echo "$rc" > EXIT_CODE.txt
            echo "PRISTINE_EBRO_EARLY_STATUS $rc"
            grep -a '^T=' RUN.log | tail -n 10 || true
          )
      - name: Compare earliest current and historical printed terrain extrema
        run: |
          python3 - <<'PY'
          import tarfile,re,json,math
          from pathlib import Path
          def points(text):
              ts=list(re.finditer(r'(?m)^\s*T=\s*([-+0-9.]+)\s*My',text))
              out={}
              for i,m in enumerate(ts):
                  t=round(float(m.group(1)),4)
                  seg=text[m.end():ts[i+1].start() if i+1<len(ts) else len(text)]
                  q=re.search(r'topogr\.\s*:\s*max=\s*([-+0-9.]+)\s*m\s*min=\s*([-+0-9.]+)\s*m',seg)
                  if q:out[t]=[float(q.group(1)),float(q.group(2))]
              return out
          original=points(Path('upstream/tisc/demo/8_Ebro_evol/Ebro_evol.screen').read_text(errors='replace'))
          pristine=points(Path('early_model/RUN.log').read_text(errors='replace'))
          with tarfile.open('results/04_09_official_demo_suite/08_ebro/08_ebro_NATIVE_RAW.tar.gz','r:gz') as t:
              optimized=points(t.extractfile('RUN.log').read().decode(errors='replace'))
          print('EARLY_LOGGED_AGES',list(pristine)[:10])
          d={'tag':'EBRO_COMPILE_NORMALIZED_ONLY_0_TO_1MYR_CROSSCHECK',
             'source':'untouched pinned original C physics except compile-only NBSP normalization',
             'prm_author_inputs_unchanged':True,'temporary_cli_end_time_Myr':-59,
             'runner_exit_code':int(Path('early_model/EXIT_CODE.txt').read_text()),
             'reference_2016_vs_2026_source_versions_not_identical':True,
             'records':{str(t):{'historical_author_topography_minmax':original.get(t),
                               'pristine_short_topography_minmax':pristine.get(t),
                               'prior_optimized_full_topography_minmax':optimized.get(t)}
                        for t in (-60,-59.5,-59)}}
          passed=d['runner_exit_code']==0 and all(t in pristine for t in (-60,-59.5,-59))
          d['short_run_numerically_completed']=passed
          dest=Path('results/04_09_official_demo_suite/08_ebro/pristine_early')
          (dest/'EARLY_SOURCE_GEOLOGY_ISOLATION.json').write_text(json.dumps(d,indent=2))
          (dest/'EARLY_SOURCE_GEOLOGY_ISOLATION.md').write_text(
              '# Ebro full-source version comparison at first 1 Myr\n\n'
              'This is not the full 60-Myr run. It compares the author 2016 historical screen, '
              'the pinned 2026 source with *only* compilation normalization, and previously '
              'completed audited-optimized full 60-Myr run at the first three recorded ages.\n\n'
              +json.dumps(d['records'],indent=2)+'\n')
          print('EARLY_EBRO_SOURCE_VERDICT',json.dumps(d))
          if not passed:raise SystemExit('Pristine original did not finish truncated 1-Myr model')
          PY
      - name: Preserve comparator, pristine raw run and original-source hash
        if: always()
        run: |
          set -euo pipefail
          d=results/04_09_official_demo_suite/08_ebro/pristine_early
          cp -a early_source_qc/. "$d/" || true
          if test -f early_model/RUN.log; then
            tar -czf "$d/PRISTINE_ORIGINAL_FIRST1MYR.tar.gz" -C early_model \
              RUN.log EXIT_CODE.txt COMMAND.txt WALL_SEC.txt Ebro_evol.PRM Ebro_evol.ZINI
          fi
          git add -f "$d"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'qc(Ebro): original pristine code early-time test and historical log triage'
            git push origin HEAD:v04-official-demo-completion
          fi
